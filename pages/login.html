<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - NeZak Chat</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <span class="brand-icon">💬</span>
            <h2>NeZak Chat</h2>
            <p class="brand-subtitle">تواصل مع الأصدقاء</p>
        </div>
        
        <!-- نموذج تسجيل الدخول العادي -->
        <div id="loginForm" class="login-form">
            <div class="input-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسمك..." maxlength="20" autofocus>
            </div>
            <button onclick="login()" class="btn-login">🚪 دخول</button>
            <p class="login-hint">✨ أدخل أي اسم للدخول كضيف</p>
        </div>

        <!-- نموذج تسجيل الدخول للمسؤول -->
        <div id="adminLoginForm" class="login-form" style="display: none;">
            <div class="admin-header">
                <span class="admin-shield-big">🛡️</span>
                <h3 style="color: #e53e3e;">دخول المسؤول</h3>
                <p style="color: #666; font-size: 13px;">أدخل كلمة المرور للدخول كمسؤول</p>
            </div>
            <div class="input-group">
                <label>🔑 اسم المستخدم</label>
                <input type="text" id="adminUsernameInput" value="slx23m" readonly style="background: #f5f5f5;">
            </div>
            <div class="input-group">
                <label>🔐 كلمة المرور</label>
                <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="adminLogin()" class="btn-admin">🛡️ دخول كمسؤول</button>
            <button onclick="backToUserLogin()" class="btn-back">🔙 رجوع</button>
        </div>
    </div>

    <script type="module">
        // التحقق من تسجيل الدخول مسبقاً
        if (localStorage.getItem('chatUsername')) {
            window.location.href = '../index.html';
        }

        // دعم تسجيل الخروج للكل (إذا كان هناك جلسة سابقة)
        window.addEventListener('load', function() {
            // تنظيف أي جلسة سابقة
            if (!sessionStorage.getItem('keepSession')) {
                localStorage.clear();
            }
        });

        window.login = function() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username) {
                showNotification('⚠️ الرجاء إدخال اسم المستخدم', 'error');
                return;
            }

            // التحقق من كود المسؤول
            if (username === 'slx23m') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminLoginForm').style.display = 'block';
                document.getElementById('adminPasswordInput').focus();
                return;
            }

            // تسجيل دخول عادي
            const userData = {
                username: username,
                role: 'user',
                isAdmin: false,
                loginTime: Date.now(),
                device: navigator.userAgent,
                lastActive: Date.now()
            };
            
            localStorage.setItem('chatUsername', username);
            localStorage.setItem('userRole', 'user');
            localStorage.setItem('isAdmin', 'false');
            localStorage.setItem('userData', JSON.stringify(userData));
            sessionStorage.setItem('keepSession', 'true');
            
            window.location.href = '../index.html';
        };

        window.adminLogin = function() {
            const password = document.getElementById('adminPasswordInput').value;
            
            if (password === '1442') {
                const adminData = {
                    username: 'المسؤول',
                    role: 'admin',
                    isAdmin: true,
                    adminCode: 'slx23m',
                    loginTime: Date.now(),
                    device: navigator.userAgent,
                    lastActive: Date.now()
                };
                
                localStorage.setItem('chatUsername', 'المسؤول');
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('adminCode', 'slx23m');
                localStorage.setItem('userData', JSON.stringify(adminData));
                sessionStorage.setItem('keepSession', 'true');
                
                window.location.href = '../index.html';
            } else {
                showNotification('❌ كلمة المرور غير صحيحة', 'error');
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPasswordInput').focus();
            }
        };

        window.backToUserLogin = function() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminLoginForm').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('usernameInput').focus();
        };

        // دعم زر Enter
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window.login();
        });

        document.getElementById('adminPasswordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window.adminLogin();
        });

        // دالة الإشعارات
        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.custom-notification');
            if (existing) existing.remove();
            
            const notif = document.createElement('div');
            notif.className = `custom-notification ${type}`;
            notif.textContent = message;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.style.opacity = '0';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        // التركيز التلقائي
        setTimeout(() => {
            document.getElementById('usernameInput').focus();
        }, 500);
    </script>
</body>
</html>
