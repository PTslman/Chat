<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - نيزك</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body>
    <div class="admin-panel-container">
        <div class="admin-panel-header">
            <div>
                <h2>🛡️ لوحة التحكم</h2>
                <p class="admin-subtitle">إدارة المستخدمين والرسائل</p>
            </div>
            <button onclick="logout()" class="logout-btn-admin">
                <span class="material-symbols-outlined">logout</span> خروج
            </button>
        </div>

        <!-- إحصائيات سريعة -->
        <div class="admin-stats-grid">
            <div class="stat-card">
                <span class="stat-icon">📨</span>
                <span class="stat-number" id="totalMessages">0</span>
                <span class="stat-label">رسائل</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">👥</span>
                <span class="stat-number" id="totalUsers">0</span>
                <span class="stat-label">مستخدمين</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🟢</span>
                <span class="stat-number" id="onlineUsers">0</span>
                <span class="stat-label">متصلين</span>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🚫</span>
                <span class="stat-number" id="blockedUsers">0</span>
                <span class="stat-label">محظورين</span>
            </div>
        </div>

        <!-- أدوات المسؤول -->
        <div class="admin-tools-section">
            <h3>🛠️ أدوات المسؤول</h3>
            <div class="admin-tools-grid">
                <button onclick="clearAllMessages()" class="admin-action danger">
                    <span class="material-symbols-outlined">delete_sweep</span> حذف الكل
                </button>
                <button onclick="exportChat()" class="admin-action primary">
                    <span class="material-symbols-outlined">download</span> تصدير
                </button>
                <button onclick="forceLogoutAll()" class="admin-action warning">
                    <span class="material-symbols-outlined">logout</span> خروج الكل
                </button>
                <button onclick="refreshData()" class="admin-action info">
                    <span class="material-symbols-outlined">refresh</span> تحديث
                </button>
            </div>
        </div>

        <!-- قائمة المستخدمين -->
        <div class="admin-users-section">
            <h3>👥 المستخدمين</h3>
            <div class="admin-users-list" id="adminUsersList">
                <div class="loading-text">جاري التحميل...</div>
            </div>
        </div>

        <!-- قائمة الرسائل -->
        <div class="admin-messages-section">
            <h3>📨 الرسائل</h3>
            <div class="admin-messages-list" id="adminMessagesList">
                <div class="loading-text">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, get, set, remove, update, onChildAdded, onValue } from '../scripts/firebase-config.js';

        // ============================================================
        // 🔒 التحقق من صلاحيات المسؤول
        // ============================================================
        const isAdmin = localStorage.getItem('isAdmin') === 'true';
        const adminCode = localStorage.getItem('adminCode');

        if (!isAdmin || adminCode !== 'slx23m') {
            alert('❌ غير مصرح لك بالدخول!');
            window.location.href = '../index.html';
        }

        // ============================================================
        // 📊 STATE
        // ============================================================
        let messageCount = 0;
        let usersCount = 0;
        let blockedUsers = [];

        // ============================================================
        // 📄 DOM REFERENCES
        // ============================================================
        const totalMessages = document.getElementById('totalMessages');
        const totalUsers = document.getElementById('totalUsers');
        const onlineUsers = document.getElementById('onlineUsers');
        const blockedUsersEl = document.getElementById('blockedUsers');
        const adminUsersList = document.getElementById('adminUsersList');
        const adminMessagesList = document.getElementById('adminMessagesList');

        // ============================================================
        // 👥 LOAD USERS
        // ============================================================
        function loadUsers() {
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                if (!snapshot.exists()) {
                    adminUsersList.innerHTML = '<div class="empty-text">لا يوجد مستخدمون</div>';
                    totalUsers.textContent = '0';
                    onlineUsers.textContent = '0';
                    return;
                }

                const users = snapshot.val();
                const usersArray = Object.keys(users).map(key => ({ id: key, ...users[key] }));
                usersCount = usersArray.length;
                totalUsers.textContent = usersCount;

                // حساب المتصلين
                const online = usersArray.filter(u => u.online === true);
                onlineUsers.textContent = online.length;

                // عرض المستخدمين
                let html = '';
                usersArray.forEach(user => {
                    const isBlocked = blockedUsers.includes(user.username);
                    const isAdminUser = user.isAdmin || user.username === 'المسؤول';
                    const avatarHtml = (user.avatar && (user.avatar.startsWith('http') || user.avatar.startsWith('data:image'))) ?
                        `<img src="${user.avatar}" alt="${user.username}">` : getInitials(user.username);
                    
                    html += `
                        <div class="admin-user-item">
                            <div class="user-info">
                                <div class="user-avatar" style="background:${user.color || '#2b6ef0'}">
                                    ${avatarHtml}
                                </div>
                                <div class="user-details">
                                    <div class="user-name">
                                        ${user.username}
                                        ${isAdminUser ? ' <span class="admin-tag">👑</span>' : ''}
                                        ${isBlocked ? ' <span class="blocked-tag">🚫</span>' : ''}
                                    </div>
                                    <div class="user-status ${user.online ? 'online' : 'offline'}">
                                        ${user.online ? '🟢 متصل' : '⚪ غير متصل'}
                                    </div>
                                </div>
                            </div>
                            <div class="user-actions">
                                ${!isAdminUser ? `
                                    ${isBlocked ? 
                                        `<button onclick="unblockUser('${user.username}')" class="action-btn unblock" title="فك الحظر">🔓</button>` : 
                                        `<button onclick="blockUser('${user.username}')" class="action-btn block" title="حظر">🚫</button>`
                                    }
                                    <button onclick="deleteUser('${user.username}')" class="action-btn delete" title="حذف الحساب">🗑️</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                adminUsersList.innerHTML = html;
            });
        }

        // ============================================================
        // 📨 LOAD MESSAGES
        // ============================================================
        function loadMessages() {
            const messagesRef = ref(database, 'messages');
            onValue(messagesRef, (snapshot) => {
                if (!snapshot.exists()) {
                    adminMessagesList.innerHTML = '<div class="empty-text">لا توجد رسائل</div>';
                    totalMessages.textContent = '0';
                    return;
                }

                const messages = snapshot.val();
                const messagesArray = Object.keys(messages).map(key => ({ id: key, ...messages[key] }));
                messageCount = messagesArray.length;
                totalMessages.textContent = messageCount;

                // عرض الرسائل (آخر 50)
                const sorted = messagesArray.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                const recent = sorted.slice(0, 50);

                let html = '';
                recent.forEach(msg => {
                    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleString('ar') : 'وقت غير معروف';
                    const isAdminMsg = msg.isAdmin || msg.sender === 'المسؤول';
                    
                    html += `
                        <div class="admin-message-item" data-id="${msg.id}">
                            <div class="msg-info">
                                <span class="msg-sender ${isAdminMsg ? 'admin' : ''}">
                                    ${isAdminMsg ? '🛡️ ' : ''}${msg.sender}
                                </span>
                                <span class="msg-time">${time}</span>
                            </div>
                            <div class="msg-text-content">
                                ${msg.text || 'رسالة فارغة'}
                                ${msg.edited ? ' <span class="edited-badge">(معدّل)</span>' : ''}
                                ${msg.deleted ? ' <span class="deleted-badge">(محذوف)</span>' : ''}
                            </div>
                            <div class="msg-actions">
                                <button onclick="deleteMessage('${msg.id}')" class="action-btn delete" title="حذف">🗑️</button>
                                ${!msg.deleted ? `<button onclick="editMessage('${msg.id}')" class="action-btn edit" title="تعديل">✏️</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                adminMessagesList.innerHTML = html;
            });
        }

        // ============================================================
        // 🚫 BLOCKED USERS
        // ============================================================
        function loadBlockedUsers() {
            const blockedRef = ref(database, 'settings/blocked');
            get(blockedRef).then((snapshot) => {
                if (snapshot.exists()) {
                    blockedUsers = snapshot.val().users || [];
                    blockedUsersEl.textContent = blockedUsers.length;
                } else {
                    blockedUsers = [];
                    blockedUsersEl.textContent = '0';
                }
            }).catch(() => {
                blockedUsers = [];
                blockedUsersEl.textContent = '0';
            });
        }

        // ============================================================
        // 🛠️ ADMIN ACTIONS
        // ============================================================
        
        // حذف مستخدم
        window.deleteUser = function(username) {
            if (!confirm(`⚠️ هل أنت متأكد من حذف حساب @${username} بالكامل؟`)) return;
            
            const userRef = ref(database, `users/${username}`);
            const messagesRef = ref(database, 'messages');
            
            remove(userRef).then(() => {
                return get(messagesRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        const messages = snapshot.val();
                        const updates = {};
                        Object.keys(messages).forEach(key => {
                            if (messages[key].sender === username) {
                                updates[`${key}`] = null;
                            }
                        });
                        if (Object.keys(updates).length > 0) {
                            return update(messagesRef, updates);
                        }
                    }
                });
            }).then(() => {
                const index = blockedUsers.indexOf(username);
                if (index > -1) {
                    blockedUsers.splice(index, 1);
                    const blockedRef = ref(database, 'settings/blocked');
                    return set(blockedRef, { users: blockedUsers });
                }
            }).then(() => {
                alert(`✅ تم حذف حساب @${username} بنجاح`);
                loadUsers();
                loadMessages();
                loadBlockedUsers();
            }).catch((error) => {
                console.error('❌ خطأ:', error);
                alert('⚠️ حدث خطأ أثناء حذف الحساب');
            });
        };

        // حظر مستخدم
        window.blockUser = function(username) {
            if (!confirm(`🚫 هل تريد حظر @${username}؟`)) return;
            
            if (!blockedUsers.includes(username)) {
                blockedUsers.push(username);
                const blockedRef = ref(database, 'settings/blocked');
                set(blockedRef, { users: blockedUsers }).then(() => {
                    alert(`✅ تم حظر @${username}`);
                    loadUsers();
                    loadBlockedUsers();
                }).catch((error) => {
                    console.error('❌ خطأ:', error);
                    alert('⚠️ حدث خطأ أثناء الحظر');
                });
            }
        };

        // فك الحظر
        window.unblockUser = function(username) {
            if (!confirm(`🔓 هل تريد فك الحظر عن @${username}؟`)) return;
            
            const index = blockedUsers.indexOf(username);
            if (index > -1) {
                blockedUsers.splice(index, 1);
                const blockedRef = ref(database, 'settings/blocked');
                set(blockedRef, { users: blockedUsers }).then(() => {
                    alert(`✅ تم فك الحظر عن @${username}`);
                    loadUsers();
                    loadBlockedUsers();
                }).catch((error) => {
                    console.error('❌ خطأ:', error);
                    alert('⚠️ حدث خطأ أثناء فك الحظر');
                });
            }
        };

        // حذف رسالة
        window.deleteMessage = function(messageId) {
            if (!confirm('🗑️ هل تريد حذف هذه الرسالة نهائياً؟')) return;
            
            const messageRef = ref(database, `messages/${messageId}`);
            remove(messageRef).then(() => {
                alert('✅ تم حذف الرسالة');
                loadMessages();
            }).catch((error) => {
                console.error('❌ خطأ:', error);
                alert('⚠️ حدث خطأ أثناء حذف الرسالة');
            });
        };

        // تعديل رسالة
        window.editMessage = function(messageId) {
            const newText = prompt('✏️ أدخل النص الجديد للرسالة:');
            if (newText && newText.trim()) {
                const messageRef = ref(database, `messages/${messageId}`);
                update(messageRef, {
                    text: newText.trim(),
                    edited: true,
                    editedAt: Date.now()
                }).then(() => {
                    alert('✅ تم تعديل الرسالة');
                    loadMessages();
                }).catch((error) => {
                    console.error('❌ خطأ:', error);
                    alert('⚠️ حدث خطأ أثناء تعديل الرسالة');
                });
            }
        };

        // حذف جميع الرسائل
        window.clearAllMessages = function() {
            if (!confirm('⚠️ هل أنت متأكد من حذف جميع الرسائل نهائياً؟')) return;
            if (prompt('🔐 أدخل كلمة المرور للتأكيد:') !== '1442') {
                alert('❌ كلمة المرور غير صحيحة');
                return;
            }
            
            const messagesRef = ref(database, 'messages');
            set(messagesRef, null).then(() => {
                alert('✅ تم حذف جميع الرسائل');
                loadMessages();
            }).catch((error) => {
                console.error('❌ خطأ:', error);
                alert('⚠️ حدث خطأ أثناء حذف الرسائل');
            });
        };

        // تصدير المحادثة
        window.exportChat = function() {
            const messagesRef = ref(database, 'messages');
            get(messagesRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('❌ لا توجد رسائل للتصدير');
                    return;
                }
                
                const messages = snapshot.val();
                let chatText = '📝 محادثة نيزك\n';
                chatText += `📅 ${new Date().toLocaleString()}\n`;
                chatText += '='.repeat(50) + '\n\n';
                
                const sorted = Object.keys(messages).sort((a, b) => (messages[a].timestamp || 0) - (messages[b].timestamp || 0));
                sorted.forEach(key => {
                    const msg = messages[key];
                    const sender = msg.isAdmin ? `🛡️ ${msg.sender}` : msg.sender;
                    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : 'وقت غير معروف';
                    chatText += `[${time}] ${sender}: ${msg.text || ''}\n`;
                    if (msg.edited) chatText += `  (معدّل)\n`;
                });
                
                const blob = new Blob([chatText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat-${new Date().toISOString().slice(0,10)}.txt`;
                a.click();
                URL.revokeObjectURL(url);
                alert('📥 تم تصدير المحادثة بنجاح');
            }).catch((error) => {
                console.error('❌ خطأ:', error);
                alert('⚠️ حدث خطأ أثناء التصدير');
            });
        };

        // تسجيل خروج جميع المستخدمين
        window.forceLogoutAll = function() {
            if (!confirm('⚠️ هل أنت متأكد من تسجيل خروج جميع المستخدمين؟')) return;
            
            const usersRef = ref(database, 'users');
            get(usersRef).then((snapshot) => {
                if (!snapshot.exists()) return;
                
                const users = snapshot.val();
                const updates = {};
                Object.keys(users).forEach(key => {
                    updates[`${key}/forceLogout`] = true;
                    updates[`${key}/online`] = false;
                });
                return update(usersRef, updates);
            }).then(() => {
                alert('✅ تم تسجيل خروج جميع المستخدمين');
                loadUsers();
            }).catch((error) => {
                console.error('❌ خطأ:', error);
                alert('⚠️ حدث خطأ أثناء تسجيل الخروج');
            });
        };

        // تحديث البيانات
        window.refreshData = function() {
            loadUsers();
            loadMessages();
            loadBlockedUsers();
            alert('✅ تم تحديث البيانات');
        };

        // ============================================================
        // 🚪 LOGOUT
        // ============================================================
        window.logout = function() {
            if (confirm('🚪 هل تريد تسجيل الخروج؟')) {
                const username = localStorage.getItem('chatUsername');
                if (username) {
                    const userRef = ref(database, `users/${username}`);
                    update(userRef, { online: false, lastSeen: Date.now() }).catch(() => {});
                }
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '../index.html';
            }
        };

        // ============================================================
        // 🛠️ UTILITY FUNCTIONS
        // ============================================================
        function getInitials(name) {
            if (!name) return '👤';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        // ============================================================
        // 🔄 AUTO REFRESH
        // ============================================================
        setInterval(() => {
            loadUsers();
            loadBlockedUsers();
        }, 30000);

        // ============================================================
        // 🚀 START
        // ============================================================
        console.log('🛡️ لوحة تحكم نيزك');
        loadUsers();
        loadMessages();
        loadBlockedUsers();
    </script>
</body>
</html>
