<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>نيزك - لوحة المحادثات</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
    <div class="app-container">
        <!-- الشريط العلوي -->
        <header class="chat-header">
            <div class="header-left">
                <button id="theme-toggle-btn" class="icon-btn">🌙</button>
                <div class="user-info">
                    <img id="user-avatar" src="" alt="avatar">
                    <span id="user-name-display"></span>
                </div>
            </div>
            <div class="header-right">
                <span id="online-count">🟢 0</span>
                <button id="admin-shield" class="icon-btn" style="display:none;">🛡️</button>
                <button id="logout-btn" class="icon-btn">🚪</button>
            </div>
        </header>
        
        <!-- منطقة المحادثات -->
        <main class="chat-main">
            <div class="users-sidebar" id="users-sidebar">
                <h3>👥 المستخدمون</h3>
                <div id="users-list"></div>
            </div>
            
            <div class="chat-area">
                <div class="messages-container" id="messages-container">
                    <!-- الرسائل تظهر هنا -->
                </div>
                
                <div class="typing-indicator" id="typing-indicator">
                    <span id="typing-text"></span>
                </div>
                
                <div class="message-input-area">
                    <input type="text" id="message-input" placeholder="اكتب رسالتك...">
                    <button id="send-btn">📨</button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- نموذج لوحة المسؤول -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>🛡️ لوحة المسؤول</h2>
            <div id="admin-users-list"></div>
        </div>
    </div>
    
    <script type="module" src="dashboard.js"></script>
    <script type="module" src="admin-panel.js"></script>
    <script type="module" src="theme-manager.js"></script>
</body>
</html>
