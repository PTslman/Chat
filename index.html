<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - NeZak Chat</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <div class="login-container">
        <h2>💬 NeZak Chat</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">أدخل اسم المستخدم الخاص بك</p>
        
        <div id="loginForm">
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="20">
            <button onclick="login()">دخول</button>
            <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #999;">مرحباً بك في عالم المراسلة</p>
        </div>

        <!-- Admin Login Form (مخفي عن العاديين) -->
        <div id="adminLoginForm" style="display: none;">
            <h3 style="color: #667eea; text-align: center;">🔐 الدخول كمدير</h3>
            <input type="text" id="adminUsernameInput" placeholder="اسم المستخدم" value="slx23m" readonly>
            <input type="password" id="adminPasswordInput" placeholder="كلمة المرور">
            <button onclick="adminLogin()">دخول كمدير</button>
            <button onclick="backToUserLogin()" style="background: #999; margin-top: 10px;">رجوع</button>
        </div>
    </div>

    <script type="module">
        import { database, ref, push, onChildAdded, set, get, child } from '../scripts/firebase-config.js';
        
        // Check if already logged in
        if (localStorage.getItem('chatUsername')) {
            window.location.href = '../index.html';
        }

        window.login = function() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username) {
                alert('الرجاء إدخال اسم المستخدم');
                return;
            }

            // Check for admin code - يظهر نموذج المدير
            if (username === 'slx23m') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminLoginForm').style.display = 'block';
                return;
            }

            // Regular login - تسجيل دخول عادي
            localStorage.setItem('chatUsername', username);
            localStorage.setItem('userRole', 'user');
            localStorage.setItem('isAdmin', 'false');
            window.location.href = '../index.html';
        };

        window.adminLogin = function() {
            const password = document.getElementById('adminPasswordInput').value;
            
            if (password === '1442') {
                // تسجيل دخول المدير مع صلاحيات كاملة
                localStorage.setItem('chatUsername', '👑 المدير');
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('adminCode', 'slx23m');
                window.location.href = '../index.html';
            } else {
                alert('❌ كلمة المرور غير صحيحة');
                document.getElementById('adminPasswordInput').value = '';
            }
        };

        window.backToUserLogin = function() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminLoginForm').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('adminPasswordInput').value = '';
        };

        // Enter key support
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window.login();
        });

        document.getElementById('adminPasswordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') window.adminLogin();
        });
    </script>
</body>
</html>
