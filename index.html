<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نيزك - مراسلة فورية</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fas fa-comet"></i>
                <span>نيزك</span>
            </div>
            <h2>مرحباً بك</h2>
            <p>تسجيل الدخول للدردشة</p>
            
            <div class="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="البريد الإلكتروني" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="كلمة المرور" />
                </div>
                <button id="login-btn" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> دخول
                </button>
                <p class="auth-switch">
                    ليس لديك حساب؟ <span id="show-signup">سجل الآن</span>
                </p>
            </div>
        </div>
    </div>

    <!-- واجهة الدردشة الرئيسية -->
    <div id="chat-app" class="chat-app" style="display: none;">
        <!-- الشريط الجانبي -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">
                        <img src="assets/images/default-avatar.png" alt="Avatar" />
                    </div>
                    <div class="user-details">
                        <span id="user-name">المستخدم</span>
                        <span class="user-status">متصل</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-icon" title="تسجيل الخروج">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            
            <div class="sidebar-search">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-contacts" placeholder="بحث..." />
                </div>
            </div>
            
            <div class="contacts-list" id="contacts-list">
                <!-- سيتم تحميل جهات الاتصال هنا -->
            </div>
        </div>

        <!-- منطقة الدردشة -->
        <div class="chat-area">
            <div class="chat-header" id="chat-header">
                <div class="chat-user-info">
                    <div class="chat-user-avatar">
                        <img src="assets/images/default-avatar.png" alt="Avatar" />
                    </div>
                    <div class="chat-user-details">
                        <span id="chat-user-name">اختر محادثة</span>
                        <span class="chat-user-status" id="chat-user-status">غير متصل</span>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <h3>ابدأ محادثة جديدة</h3>
                    <p>اختر أحد جهات الاتصال للبدء</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <button class="btn-icon" id="emoji-btn" title="إيموجي">
                        <i class="fas fa-face-smile"></i>
                    </button>
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="اكتب رسالة..." 
                        disabled
                    />
                    <button class="btn-primary" id="send-btn" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
