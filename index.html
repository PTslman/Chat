<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 دردشة</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ===== الحاوية الرئيسية ===== */
        #app {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background: #000;
        }

        .chat-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 431px) {
            .chat-container {
                border-radius: 30px;
                height: 90vh;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            }
        }

        @media (max-width: 430px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 0;
                height: 100%;
            }
        }

        /* ===== رأس الدردشة ===== */
        .chat-header {
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px 10px;
            padding-top: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            min-height: 60px;
            position: relative;
            z-index: 10;
        }

        /* الساعة */
        .status-bar {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #0a84ff, #5ac8fa);
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
            flex: 1;
        }

        .header-info .name {
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-info .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-actions .logout-btn {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.05);
            border: none;
        }

        .header-actions .logout-btn:hover {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }

        /* ===== منطقة الرسائل ===== */
        .chat-messages {
            flex: 1;
            padding: 6px 12px 4px;
            overflow-y: auto;
            overflow-x: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 0;
        }

        /* ===== باقة الرسائل ===== */
        .message-group {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: messageIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .message-group.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-group.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(6px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* اسم المرسل */
        .message-sender {
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
            padding: 0 12px 1px;
            display: none;
        }

        .message-group.other .message-sender {
            display: block;
        }

        /* فقاعة الرسالة */
        .message-bubble {
            padding: 8px 12px 7px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
            letter-spacing: -0.1px;
            max-width: 100%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .message-group.self .message-bubble {
            background: #0a84ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-group.other .message-bubble {
            background: #2c2c2e;
            color: white;
            border-bottom-left-radius: 4px;
        }

        /* الرد */
        .reply-preview {
            background: rgba(255, 255, 255, 0.06);
            border-right: 2px solid #0a84ff;
            padding: 3px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .reply-preview .reply-sender {
            color: #0a84ff;
            font-weight: 600;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        /* التوقيت */
        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            padding: 0 4px;
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .message-group.self .message-time {
            color: rgba(255, 255, 255, 0.3);
        }

        .read-status {
            font-size: 10px;
            color: #0a84ff;
        }

        /* ===== أزرار التفاعل (الضغطة المطولة) ===== */
        .message-actions-overlay {
            position: absolute;
            top: -34px;
            background: rgba(44, 44, 46, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 3px 5px;
            display: none;
            gap: 2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 20;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            animation: actionsPop 0.15s ease;
        }

        .message-group.self .message-actions-overlay {
            right: 0;
        }

        .message-group.other .message-actions-overlay {
            left: 0;
        }

        .message-actions-overlay.active {
            display: flex;
        }

        @keyframes actionsPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .message-actions-overlay button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 15px;
            padding: 4px 7px;
            border-radius: 10px;
            transition: 0.15s;
        }

        .message-actions-overlay button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .message-actions-overlay button.delete:hover {
            color: #ff3b30;
        }

        .message-actions-overlay button.reply-btn:hover {
            color: #0a84ff;
        }

        /* ===== رسائل النظام ===== */
        .system-message {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            margin: 3px auto;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            max-width: 85%;
        }

        /* ===== الحالة الفارغة ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.06);
            gap: 6px;
        }

        .empty-state i {
            font-size: 40px;
        }

        .empty-state span {
            font-size: 13px;
        }

        /* ===== شريط الإيموجي ===== */
        .emoji-rail {
            position: absolute;
            bottom: 74px;
            left: 12px;
            right: 12px;
            background: rgba(44, 44, 46, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 6px 10px;
            display: none;
            gap: 4px;
            justify-content: center;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            border: 0.5px solid rgba(255, 255, 255, 0.05);
            z-index: 30;
            animation: emojiRailUp 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-wrap: wrap;
        }

        .emoji-rail.active {
            display: flex;
        }

        @keyframes emojiRailUp {
            from {
                transform: translateY(15px) scale(0.92);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .emoji-rail .emoji-item {
            font-size: 28px;
            padding: 2px 5px;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.12s;
            background: none;
            border: none;
            line-height: 1.2;
        }

        .emoji-rail .emoji-item:active {
            transform: scale(1.25);
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== إدخال الرسالة ===== */
        .chat-input {
            padding: 6px 12px 12px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
            position: relative;
            padding-bottom: 16px;
        }

        .chat-input .input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .chat-input .input-wrapper {
            flex: 1;
            background: #2c2c2e;
            border-radius: 22px;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.15s;
            min-width: 0;
        }

        .chat-input .input-wrapper:focus-within {
            border-color: #0a84ff;
        }

        .chat-input .input-wrapper .emoji-toggle {
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            padding: 4px 6px;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .chat-input .input-wrapper .emoji-toggle.active {
            color: #0a84ff;
        }

        .chat-input .input-wrapper input {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: transparent;
            color: white;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }

        .chat-input .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .chat-input .input-wrapper input:disabled {
            opacity: 0.4;
        }

        .chat-input .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0a84ff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input .send-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .chat-input .send-btn:not(:disabled):active {
            transform: scale(0.92);
        }

        /* ===== شاشة تسجيل الدخول ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: #1c1c1e;
            padding: 32px 24px;
            border-radius: 28px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            border: 0.5px solid rgba(255, 255, 255, 0.04);
        }

        .login-box .logo {
            font-size: 48px;
            margin-bottom: 2px;
        }

        .login-box h1 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .login-box h1 span {
            color: #0a84ff;
        }

        .login-box p {
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 18px;
            font-size: 13px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            background: #2c2c2e;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: 0.15s;
        }

        .login-box input:focus {
            border-color: #0a84ff;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .login-box .color-options {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 14px 0 18px;
            flex-wrap: wrap;
        }

        .login-box .color-options .color-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.15s;
        }

        .login-box .color-options .color-circle:active {
            transform: scale(0.9);
        }

        .login-box .color-options .color-circle.selected {
            border-color: white;
            transform: scale(1.1);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 12px;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .login-box .login-btn:active {
            transform: scale(0.97);
        }

        .login-box .login-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .login-box .error {
            color: #ff3b30;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* ===== مؤشر الكتابة (يظهر تلقائياً) ===== */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 6px 14px;
            background: #2c2c2e;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            margin: 2px 0;
            gap: 4px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* ===== متجاوب للشاشات الصغيرة جداً ===== */
        @media (max-width: 380px) {
            .message-group {
                max-width: 88%;
            }
            .message-bubble {
                font-size: 14px;
                padding: 6px 10px;
            }
            .chat-header {
                padding-top: 40px;
                padding-left: 12px;
                padding-right: 12px;
            }
            .header-info .name {
                font-size: 14px;
            }
            .avatar {
                width: 30px;
                height: 30px;
                font-size: 13px;
            }
            .emoji-rail .emoji-item {
                font-size: 22px;
                padding: 2px 4px;
            }
        }

        /* ===== شاشات كبيرة ===== */
        @media (min-width: 600px) {
            .message-group {
                max-width: 65%;
            }
            .chat-messages {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- ===== شاشة تسجيل الدخول ===== -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-box">
                <div class="logo">💬</div>
                <h1>دردشة <span>فورية</span></h1>
                <p>اختر اسماً ولونك المفضل</p>
                <input type="text" id="usernameInput" placeholder="اسم المستخدم..." maxlength="20" autocomplete="off">
                <div class="color-options" id="colorPicker">
                    <div class="color-circle selected" style="background:#0a84ff;" data-color="#0a84ff"></div>
                    <div class="color-circle" style="background:#ff3b30;" data-color="#ff3b30"></div>
                    <div class="color-circle" style="background:#ff9500;" data-color="#ff9500"></div>
                    <div class="color-circle" style="background:#ffcc00;" data-color="#ffcc00"></div>
                    <div class="color-circle" style="background:#34c759;" data-color="#34c759"></div>
                    <div class="color-circle" style="background:#af52de;" data-color="#af52de"></div>
                    <div class="color-circle" style="background:#ff6b8a;" data-color="#ff6b8a"></div>
                    <div class="color-circle" style="background:#5ac8fa;" data-color="#5ac8fa"></div>
                </div>
                <button class="login-btn" id="loginBtn">🚀 دخول</button>
                <div class="error" id="loginError">⚠️ الاسم يجب أن يكون حرفين على الأقل</div>
                <div class="error" id="connectionError" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== واجهة الدردشة ===== -->
        <div class="chat-container" id="chatContainer" style="display:none;">

            <!-- رأس الدردشة -->
            <div class="chat-header">
                <div class="status-bar" id="statusTime">12:00</div>

                <div class="header-left">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div class="header-info">
                        <div class="name" id="currentUser">المستخدم</div>
                        <div class="subtitle" id="onlineStatus">🟢 متصل</div>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="logout-btn" id="logoutBtn" title="تسجيل الخروج">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <!-- منطقة الرسائل -->
            <div class="chat-messages" id="messages">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-comment-dots"></i>
                    <span>لا توجد رسائل</span>
                </div>
            </div>

            <!-- شريط الإيموجي -->
            <div class="emoji-rail" id="emojiRail">
                <button class="emoji-item">😊</button>
                <button class="emoji-item">😂</button>
                <button class="emoji-item">❤️</button>
                <button class="emoji-item">🔥</button>
                <button class="emoji-item">👍</button>
                <button class="emoji-item">👏</button>
                <button class="emoji-item">😍</button>
                <button class="emoji-item">🤩</button>
                <button class="emoji-item">💯</button>
                <button class="emoji-item">🎉</button>
                <button class="emoji-item">✨</button>
                <button class="emoji-item">💪</button>
                <button class="emoji-item">🤔</button>
                <button class="emoji-item">😎</button>
                <button class="emoji-item">🥰</button>
                <button class="emoji-item">😭</button>
                <button class="emoji-item">🤣</button>
                <button class="emoji-item">😱</button>
                <button class="emoji-item">🙏</button>
                <button class="emoji-item">💀</button>
            </div>

            <!-- إدخال الرسالة -->
            <div class="chat-input">
                <div class="input-row">
                    <div class="input-wrapper">
                        <span class="emoji-toggle" id="emojiToggle"><i class="far fa-smile"></i></span>
                        <input type="text" id="msgInput" placeholder="اكتب رسالة..." disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 إعدادات Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDKF6Jb-CLB8xM7TvNfoRnxWgiwD54SOXo",
            authDomain: "chat-app-ba3c8.firebaseapp.com",
            projectId: "chat-app-ba3c8",
            storageBucket: "chat-app-ba3c8.firebasestorage.app",
            messagingSenderId: "181727674867",
            appId: "1:181727674867:web:ae9824d9051bab9f73d286",
            measurementId: "G-VEL3PGTKY1"
        };

        // ============================================================
        // تهيئة Firebase
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // المتغيرات العامة
        // ============================================================
        let currentUser = '';
        let userColor = '#0a84ff';
        let isLoggedIn = false;
        let replyTo = null;
        let editingMessage = null;
        let unsubscribeMessages = null;
        let typingTimeout = null;
        let isTyping = false;

        // ============================================================
        // عناصر DOM
        // ============================================================
        const loginOverlay = document.getElementById('loginOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const connectionError = document.getElementById('connectionError');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentUserSpan = document.getElementById('currentUser');
        const userAvatar = document.getElementById('userAvatar');
        const onlineStatus = document.getElementById('onlineStatus');
        const emojiToggle = document.getElementById('emojiToggle');
        const emojiRail = document.getElementById('emojiRail');
        const emptyState = document.getElementById('emptyState');
        const logoutBtn = document.getElementById('logoutBtn');

        // ============================================================
        // الساعة
        // ============================================================
        function updateStatusBar() {
            const now = new Date();
            document.getElementById('statusTime').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }
        updateStatusBar();
        setInterval(updateStatusBar, 30000);

        // ============================================================
        // اختيار اللون
        // ============================================================
        document.querySelectorAll('.color-circle').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                userColor = this.dataset.color;
            });
        });

        // ============================================================
        // شريط الإيموجي
        // ============================================================
        emojiToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiRail.classList.toggle('active');
            emojiToggle.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!emojiRail.contains(e.target) && e.target !== emojiToggle && !emojiToggle.contains(e.target)) {
                emojiRail.classList.remove('active');
                emojiToggle.classList.remove('active');
            }
        });

        document.querySelectorAll('.emoji-item').forEach(el => {
            el.addEventListener('click', () => {
                msgInput.value += el.textContent;
                msgInput.focus();
                emojiRail.classList.remove('active');
                emojiToggle.classList.remove('active');
            });
        });

        // ============================================================
        // إنشاء عنصر رسالة
        // ============================================================
        function createMessageElement(docId, data, isSelf) {
            const group = document.createElement('div');
            group.className = `message-group ${isSelf ? 'self' : 'other'}`;
            group.dataset.id = docId;
            group.dataset.sender = data.sender;

            const sender = document.createElement('div');
            sender.className = 'message-sender';
            sender.textContent = data.sender;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (data.replyTo) {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'reply-preview';
                replyDiv.innerHTML =
                    `<span class="reply-sender">@${data.replyTo.sender}</span> ${data.replyTo.text.substring(0, 50)}${data.replyTo.text.length > 50 ? '...' : ''}`;
                bubble.appendChild(replyDiv);
            }

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = data.text;
            bubble.appendChild(textDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            if (data.timestamp) {
                const date = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                timeDiv.textContent = date.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
                if (isSelf) {
                    timeDiv.innerHTML += ` <span class="read-status"><i class="fas fa-check-double"></i></span>`;
                }
            }

            const actions = document.createElement('div');
            actions.className = 'message-actions-overlay';
            actions.innerHTML = `
                <button class="reply-btn" title="رد"><i class="fas fa-reply"></i></button>
                ${isSelf ? `<button class="edit-btn" title="تعديل"><i class="fas fa-pen"></i></button>` : ''}
                ${isSelf ? `<button class="delete-btn" title="حذف"><i class="fas fa-trash"></i></button>` : ''}
            `;

            actions.querySelector('.reply-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                setReplyTo(docId, data.sender, data.text);
                hideAllActions();
            });

            if (isSelf) {
                const editBtn = actions.querySelector('.edit-btn');
                const deleteBtn = actions.querySelector('.delete-btn');
                if (editBtn) {
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEditing(docId, data.text);
                        hideAllActions();
                    });
                }
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteMessage(docId);
                        hideAllActions();
                    });
                }
            }

            group.appendChild(sender);
            group.appendChild(bubble);
            group.appendChild(timeDiv);
            group.appendChild(actions);

            // ===== الضغطة المطولة =====
            let pressTimer = null;
            let isPressed = false;

            const startPress = () => {
                isPressed = true;
                pressTimer = setTimeout(() => {
                    if (isPressed) {
                        hideAllActions();
                        actions.classList.add('active');
                    }
                }, 500);
            };

            const endPress = () => {
                isPressed = false;
                clearTimeout(pressTimer);
            };

            group.addEventListener('mousedown', startPress);
            group.addEventListener('mouseup', endPress);
            group.addEventListener('mouseleave', endPress);
            group.addEventListener('touchstart', (e) => {
                isPressed = true;
                pressTimer = setTimeout(() => {
                    if (isPressed) {
                        e.preventDefault();
                        hideAllActions();
                        actions.classList.add('active');
                    }
                }, 500);
            }, { passive: true });
            group.addEventListener('touchend', endPress);
            group.addEventListener('touchmove', endPress);

            return group;
        }

        // ============================================================
        // إخفاء كل الأزرار
        // ============================================================
        function hideAllActions() {
            document.querySelectorAll('.message-actions-overlay.active').forEach(el => {
                el.classList.remove('active');
            });
        }

        document.addEventListener('click', hideAllActions);

        // ============================================================
        // إضافة رسالة
        // ============================================================
        function addMessageToUI(docId, data, isSelf) {
            if (emptyState) emptyState.style.display = 'none';
            const el = createMessageElement(docId, data, isSelf);
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        // رسالة نظام
        // ============================================================
        function addSystemMessage(text) {
            if (emptyState) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'system-message';
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        // تحميل الرسائل
        // ============================================================
        function loadMessages() {
            if (emptyState) emptyState.style.display = 'flex';

            db.collection('messages')
                .orderBy('timestamp', 'asc')
                .limit(100)
                .get()
                .then((snapshot) => {
                    if (emptyState) emptyState.style.display = 'none';
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        addMessageToUI(doc.id, data, data.sender === currentUser);
                    });
                    if (snapshot.empty && emptyState) emptyState.style.display = 'flex';
                })
                .catch((error) => {
                    console.error('❌ Error loading:', error);
                });
        }

        // ============================================================
        // الاستماع للرسائل
        // ============================================================
        function listenToMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = db.collection('messages')
                .orderBy('timestamp', 'asc')
                .limit(100)
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (!existing) {
                                addMessageToUI(change.doc.id, data, data.sender === currentUser);
                            }
                        }
                        if (change.type === 'modified') {
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (existing) {
                                const data = change.doc.data();
                                const textDiv = existing.querySelector('.message-text');
                                if (textDiv) textDiv.textContent = data.text;
                            }
                        }
                        if (change.type === 'removed') {
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (existing) existing.remove();
                        }
                    });
                    if (snapshot.empty) {
                        if (emptyState) emptyState.style.display = 'flex';
                    } else {
                        if (emptyState) emptyState.style.display = 'none';
                    }
                }, (error) => {
                    console.error('❌ Error listening:', error);
                });
        }

        // ============================================================
        // إرسال رسالة
        // ============================================================
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !isLoggedIn) return;

            if (editingMessage) {
                updateMessage(editingMessage.id, text);
                return;
            }

            sendBtn.disabled = true;
            msgInput.disabled = true;

            const messageData = {
                text: text,
                sender: currentUser,
                color: userColor,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (replyTo) {
                messageData.replyTo = {
                    id: replyTo.id,
                    sender: replyTo.sender,
                    text: replyTo.text.substring(0, 60) + (replyTo.text.length > 60 ? '...' : '')
                };
            }

            db.collection('messages').add(messageData)
                .then(() => {
                    msgInput.value = '';
                    msgInput.focus();
                    clearReply();
                })
                .catch((error) => {
                    console.error('❌ Error sending:', error);
                    alert('⚠️ فشل الإرسال');
                })
                .finally(() => {
                    sendBtn.disabled = false;
                    msgInput.disabled = false;
                });
        }

        // ============================================================
        // تعديل رسالة
        // ============================================================
        function startEditing(id, text) {
            editingMessage = { id, text };
            msgInput.value = text;
            msgInput.focus();
            sendBtn.innerHTML = '<i class="fas fa-check"></i>';
            sendBtn.style.background = '#ffcc00';
        }

        function updateMessage(id, newText) {
            if (!editingMessage) return;

            db.collection('messages').doc(id).update({
                text: newText,
                edited: true
            })
            .then(() => {
                editingMessage = null;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                sendBtn.style.background = '';
                msgInput.value = '';
            })
            .catch((error) => {
                console.error('❌ Error updating:', error);
                alert('⚠️ فشل التعديل');
            });
        }

        // ============================================================
        // حذف رسالة
        // ============================================================
        function deleteMessage(id) {
            if (!confirm('🗑️ هل أنت متأكد من حذف هذه الرسالة؟')) return;

            db.collection('messages').doc(id).delete()
                .catch((error) => {
                    console.error('❌ Error deleting:', error);
                    alert('⚠️ فشل الحذف');
                });
        }

        // ============================================================
        // الرد على رسالة
        // ============================================================
        function setReplyTo(id, sender, text) {
            replyTo = { id, sender, text };
            msgInput.placeholder = `رد على @${sender}...`;
            msgInput.focus();
        }

        function clearReply() {
            replyTo = null;
            msgInput.placeholder = 'اكتب رسالة...';
        }

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (editingMessage) {
                    editingMessage = null;
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    sendBtn.style.background = '';
                    msgInput.value = '';
                }
                clearReply();
            }
        });

        // ============================================================
        // حالة المتصلين
        // ============================================================
        function updateOnlineStatus() {
            db.collection('users')
                .where('online', '==', true)
                .get()
                .then((snapshot) => {
                    const count = snapshot.size;
                    onlineStatus.textContent = count > 1 ? `🟢 ${count} متصل` : '🟢 متصل';
                })
                .catch((error) => {
                    console.error('❌ Error:', error);
                });
        }

        // ============================================================
        // إدارة حالة المستخدم
        // ============================================================
        function setUserOnline(username) {
            db.collection('users').doc(username).set({
                username: username,
                color: userColor,
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => {
                console.error('❌ Error:', error);
            });
        }

        function setUserOffline(username) {
            db.collection('users').doc(username).update({
                online: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => {
                console.error('❌ Error:', error);
            });
        }

        // ============================================================
        // تسجيل الخروج
        // ============================================================
        function logout() {
            if (!confirm('🚪 هل تريد تسجيل الخروج؟')) return;

            setUserOffline(currentUser);
            addSystemMessage(`👋 ${currentUser} غادر الدردشة`);

            isLoggedIn = false;
            currentUser = '';

            // إلغاء الاستماع
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }

            // إخفاء الدردشة وإظهار تسجيل الدخول
            chatContainer.style.display = 'none';
            loginOverlay.classList.remove('hidden');

            // مسح الرسائل
            messagesDiv.innerHTML = `<div class="empty-state" id="emptyState">
                <i class="fas fa-comment-dots"></i>
                <span>لا توجد رسائل</span>
            </div>`;

            // إعادة تعيين الإدخال
            msgInput.disabled = true;
            sendBtn.disabled = true;
            msgInput.value = '';

            // مسح التخزين المحلي
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_color');

            // إعادة تعيين الأزرار
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            sendBtn.style.background = '';
            clearReply();
            editingMessage = null;
        }

        logoutBtn.addEventListener('click', logout);

        // ============================================================
        // تسجيل الدخول
        // ============================================================
        async function login() {
            const username = usernameInput.value.trim();
            if (!username || username.length < 2) {
                loginError.style.display = 'block';
                return;
            }
            loginError.style.display = 'none';
            connectionError.style.display = 'none';

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري...';

            try {
                await auth.signInAnonymously();

                currentUser = username;
                isLoggedIn = true;

                // حفظ في localStorage
                localStorage.setItem('chat_username', username);
                localStorage.setItem('chat_color', userColor);

                loginOverlay.classList.add('hidden');
                chatContainer.style.display = 'flex';
                currentUserSpan.textContent = username;
                userAvatar.textContent = username.charAt(0).toUpperCase();

                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.focus();

                setUserOnline(username);
                addSystemMessage(`👋 ${username} انضم إلى الدردشة`);

                loadMessages();
                listenToMessages();
                updateOnlineStatus();
                setInterval(updateOnlineStatus, 10000);

                window.addEventListener('beforeunload', () => {
                    setUserOffline(username);
                });

            } catch (error) {
                console.error('❌ Login error:', error);
                connectionError.textContent = '❌ ' + error.message;
                connectionError.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 دخول';
            }
        }

        // ============================================================
        // التحقق من وجود مستخدم محفوظ
        // ============================================================
        function checkSavedUser() {
            const savedUsername = localStorage.getItem('chat_username');
            const savedColor = localStorage.getItem('chat_color');

            if (savedUsername && savedColor) {
                usernameInput.value = savedUsername;
                userColor = savedColor;

                // تحديد اللون المحفوظ
                document.querySelectorAll('.color-circle').forEach(el => {
                    el.classList.toggle('selected', el.dataset.color === savedColor);
                });

                // تسجيل الدخول تلقائياً
                setTimeout(login, 300);
            }
        }

        // ============================================================
        // الأحداث
        // ============================================================
        loginBtn.addEventListener('click', login);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ============================================================
        // تشغيل التطبيق
        // ============================================================
        console.log('🚀 Chat app ready!');
        checkSavedUser();

        // ============================================================
        // إعادة تعيين حالة التطبيق إذا كان المستخدم غير مسجل
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (!user && !isLoggedIn) {
                // المستخدم غير مسجل، نعرض شاشة الدخول
                loginOverlay.classList.remove('hidden');
                chatContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
