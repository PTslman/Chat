<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeZak Chat - دردشة الأصدقاء</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="app-container">
        <!-- شريط الحالة العلوي -->
        <div class="status-bar">
            <span class="status-time" id="currentTime"></span>
            <span class="status-icons">📶 🔋</span>
        </div>

        <!-- رأس الدردشة -->
        <div class="chat-header" id="chatHeader">
            <div class="header-left">
                <button onclick="toggleSidebar()" class="menu-btn">☰</button>
                <div>
                    <h3 id="chatTitle">💬 NeZak Chat</h3>
                    <span class="header-status" id="onlineStatus">🟢 متصل</span>
                </div>
            </div>
            <div class="header-right">
                <button onclick="logout()" class="logout-btn" title="تسجيل الخروج">🚪</button>
            </div>
        </div>

        <!-- الشريط الجانبي (للمسؤول) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span style="font-size: 24px;">🛡️</span>
                <h4>لوحة المسؤول</h4>
                <button onclick="toggleSidebar()" class="close-sidebar">✕</button>
            </div>
            
            <div class="sidebar-content">
                <!-- إحصائيات -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-icon">📨</span>
                        <span class="stat-number" id="totalMessages">0</span>
                        <span class="stat-label">رسائل</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">👥</span>
                        <span class="stat-number" id="totalUsers">0</span>
                        <span class="stat-label">مستخدمين</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">🟢</span>
                        <span class="stat-number" id="onlineUsers">0</span>
                        <span class="stat-label">متصلين</span>
                    </div>
                </div>

                <!-- قائمة المستخدمين -->
                <div class="users-section">
                    <h5>👥 المستخدمين النشطين</h5>
                    <div id="usersList" class="users-list">
                        <div class="user-item">
                            <span class="user-status online">🟢</span>
                            <span class="username">جاري التحميل...</span>
                        </div>
                    </div>
                </div>

                <!-- أدوات المسؤول -->
                <div class="admin-tools">
                    <h5>🛠️ أدوات المسؤول</h5>
                    <button onclick="clearAllMessages()" class="admin-action danger">🧹 حذف الكل</button>
                    <button onclick="exportChat()" class="admin-action primary">📥 تصدير المحادثة</button>
                    <button onclick="kickUser()" class="admin-action warning">🚫 طرد مستخدم</button>
                    <button onclick="muteUser()" class="admin-action warning">🔇 كتم مستخدم</button>
                    <button onclick="clearAllChat()" class="admin-action danger">🗑️ مسح المحادثة</button>
                </div>
            </div>
        </div>

        <!-- منطقة الرسائل (مقاربة للواتساب) -->
        <div class="messages-area" id="messagesArea">
            <div class="chat-placeholder">
                <span class="placeholder-icon">💬</span>
                <p>مرحباً بك في NeZak Chat</p>
                <span class="placeholder-sub">ابدأ المحادثة الآن</span>
            </div>
        </div>
        
        <!-- منطقة الإدخال (مقاربة للواتساب) -->
        <div class="input-area">
            <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." maxlength="500">
            <button onclick="sendMessage()" class="send-btn">📤</button>
        </div>
    </div>

    <!-- Overlay للشريط الجانبي -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <script type="module">
        // ========================================
        // استيراد Firebase
        // ========================================
        import { database, ref, push, onChildAdded, set, remove, update, get, child, query, orderByChild, limitToLast, onValue } from './scripts/firebase-config.js';
        
        // ========================================
        // متغيرات الجلسة
        // ========================================
        const username = localStorage.getItem('chatUsername') || 'زائر';
        const userRole = localStorage.getItem('userRole') || 'user';
        const isAdmin = localStorage.getItem('isAdmin') === 'true';
        const adminCode = localStorage.getItem('adminCode');
        const userData = JSON.parse(localStorage.getItem('userData') || '{}');

        // ========================================
        // عناصر DOM
        // ========================================
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const chatHeader = document.getElementById('chatHeader');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const chatTitle = document.getElementById('chatTitle');

        // ========================================
        // تهيئة واجهة المسؤول
        // ========================================
        if (isAdmin && adminCode === 'slx23m') {
            chatHeader.style.background = 'linear-gradient(135deg, #075e54 0%, #128c7e 100%)';
            chatTitle.innerHTML = '🛡️ NeZak Chat (مدير)';
            document.querySelector('.status-bar').style.background = '#075e54';
            
            // إظهار الشريط الجانبي للمسؤول
            document.querySelector('.menu-btn').style.display = 'block';
        } else {
            document.querySelector('.menu-btn').style.display = 'none';
        }

        // ========================================
        // دالة تبديل الشريط الجانبي
        // ========================================
        window.toggleSidebar = function() {
            if (!isAdmin) return;
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        };

        // ========================================
        // عرض الوقت الحالي
        // ========================================
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }
        updateTime();
        setInterval(updateTime, 30000);

        // ========================================
        // تحميل الرسائل (مقارب للواتساب)
        // ========================================
        const messagesRef = ref(database, 'messages');
        let messagesList = [];
        let messageCount = 0;

        // تحميل آخر 50 رسالة
        const recentMessagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(50));
        
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messageId = snapshot.key;
            
            messagesList.push({ id: messageId, ...data });
            messageCount++;
            
            // تحديث عدد الرسائل
            document.getElementById('totalMessages').textContent = messageCount;
            
            // عرض الرسالة
            displayMessage(messageId, data);
        });

        // ========================================
        // دالة عرض الرسالة (مقاربة للواتساب)
        // ========================================
        function displayMessage(messageId, data) {
            const messageDiv = document.createElement('div');
            const isOwn = data.sender === username || (isAdmin && data.sender === 'المسؤول');
            messageDiv.className = `message-wrapper ${isOwn ? 'sent' : 'received'}`;
            messageDiv.dataset.messageId = messageId;
            messageDiv.dataset.sender = data.sender;
            
            const isAdminSender = data.isAdmin || false;
            const senderDisplay = isAdminSender ? `🛡️ ${data.sender}` : data.sender;
            
            // تنسيق الوقت
            const time = new Date(data.timestamp);
            const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="message-sender">${senderDisplay}</div>
                    <div class="message-text">${escapeHtml(data.text)}</div>
                    <div class="message-time">
                        ${timeStr}
                        ${isOwn ? ' ✅' : ''}
                        ${data.edited ? ' ✏️' : ''}
                    </div>
                </div>
                ${isAdmin ? `
                    <div class="message-actions">
                        <button onclick="editMessage('${messageId}')" class="action-btn edit" title="تعديل">✏️</button>
                        <button onclick="deleteMessage('${messageId}')" class="action-btn delete" title="حذف">🗑️</button>
                    </div>
                ` : ''}
            `;
            
            // إزالة placeholder
            const placeholder = messagesArea.querySelector('.chat-placeholder');
            if (placeholder) placeholder.remove();
            
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // ========================================
        // دالة تنسيق النص
        // ========================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================
        // دالة إرسال رسالة
        // ========================================
        window.sendMessage = function() {
            const text = messageInput.value.trim();
            
            if (!text) return;
            
            push(messagesRef, {
                sender: username,
                text: text,
                timestamp: Date.now(),
                isAdmin: isAdmin && adminCode === 'slx23m',
                userRole: userRole,
                edited: false
            });
            
            messageInput.value = '';
            messageInput.focus();
        };

        // ========================================
        // دوال المسؤول
        // ========================================
        
        // حذف رسالة
        window.deleteMessage = function(messageId) {
            if (!isAdmin) return;
            if (confirm('هل تريد حذف هذه الرسالة؟')) {
                const messageRef = ref(database, `messages/${messageId}`);
                remove(messageRef);
                const msgElement = document.querySelector(`[data-message-id="${messageId}"]`);
                if (msgElement) msgElement.remove();
                messageCount--;
                document.getElementById('totalMessages').textContent = messageCount;
            }
        };

        // تعديل رسالة
        window.editMessage = function(messageId) {
            if (!isAdmin) return;
            
            const msgData = messagesList.find(msg => msg.id === messageId);
            if (!msgData) return;
            
            const newText = prompt('تعديل الرسالة:', msgData.text);
            if (newText && newText.trim() !== '') {
                const messageRef = ref(database, `messages/${messageId}`);
                update(messageRef, {
                    text: newText.trim(),
                    edited: true,
                    editedAt: Date.now()
                });
            }
        };

        // حذف جميع الرسائل
        window.clearAllMessages = function() {
            if (!isAdmin) return;
            if (confirm('⚠️ حذف جميع الرسائل؟')) {
                const password = prompt('أدخل كلمة المرور للتأكيد:');
                if (password === '1442') {
                    set(messagesRef, null);
                    messagesList = [];
                    messageCount = 0;
                    document.getElementById('totalMessages').textContent = '0';
                    messagesArea.innerHTML = `
                        <div class="chat-placeholder">
                            <span class="placeholder-icon">🗑️</span>
                            <p>تم حذف جميع الرسائل</p>
                        </div>
                    `;
                    showToast('✅ تم حذف جميع الرسائل');
                }
            }
        };

        // تصدير المحادثة
        window.exportChat = function() {
            if (!isAdmin) return;
            
            let chatText = '📝 محادثة NeZak Chat\n';
            chatText += `📅 ${new Date().toLocaleString()}\n`;
            chatText += '='.repeat(50) + '\n\n';
            
            messagesList.forEach(msg => {
                const sender = msg.isAdmin ? `🛡️ ${msg.sender}` : msg.sender;
                const time = new Date(msg.timestamp).toLocaleTimeString();
                chatText += `[${time}] ${sender}: ${msg.text}\n`;
                if (msg.edited) chatText += `  (تم التعديل)\n`;
            });
            
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 تم تصدير المحادثة');
        };

        // طرد مستخدم
        window.kickUser = function() {
            if (!isAdmin) return;
            const user = prompt('أدخل اسم المستخدم للطرد:');
            if (user) {
                showToast(`🚫 تم طرد المستخدم: ${user}`);
                // يمكن إضافة منطق الطرد هنا
            }
        };

        // كتم مستخدم
        window.muteUser = function() {
            if (!isAdmin) return;
            const user = prompt('أدخل اسم المستخدم للكتم:');
            if (user) {
                showToast(`🔇 تم كتم المستخدم: ${user}`);
                // يمكن إضافة منطق الكتم هنا
            }
        };

        // مسح المحادثة
        window.clearAllChat = function() {
            if (!isAdmin) return;
            if (confirm('⚠️ مسح جميع الرسائل؟')) {
                set(messagesRef, null);
                messagesList = [];
                messageCount = 0;
                document.getElementById('totalMessages').textContent = '0';
                messagesArea.innerHTML = `
                    <div class="chat-placeholder">
                        <span class="placeholder-icon">🧹</span>
                        <p>تم مسح المحادثة</p>
                    </div>
                `;
                showToast('🧹 تم مسح المحادثة');
            }
        };

        // ========================================
        // عرض المستخدمين النشطين
        // ========================================
        function loadUsers() {
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                const users = snapshot.val() || {};
                const userList = document.getElementById('usersList');
                userList.innerHTML = '';
                
                let onlineCount = 0;
                Object.keys(users).forEach(key => {
                    const user = users[key];
                    if (user.isOnline) onlineCount++;
                    
                    const userItem = document.createElement('div');
                    userItem.className = 'user-item';
                    userItem.innerHTML = `
                        <span class="user-status ${user.isOnline ? 'online' : 'offline'}">${user.isOnline ? '🟢' : '⚪'}</span>
                        <span class="username">${user.username}</span>
                        ${user.isAdmin ? '<span class="admin-badge-small">🛡️</span>' : ''}
                        ${user.isOnline ? '<span class="online-badge">●</span>' : ''}
                    `;
                    userList.appendChild(userItem);
                });
                
                document.getElementById('totalUsers').textContent = Object.keys(users).length;
                document.getElementById('onlineUsers').textContent = onlineCount;
            });
        }

        // ========================================
        // تحديث حالة المستخدم
        // ========================================
        function updateUserStatus() {
            const userRef = ref(database, `users/${username}`);
            set(userRef, {
                username: username,
                isAdmin: isAdmin,
                isOnline: true,
                lastSeen: Date.now(),
                userData: userData
            });
            
            // تحديث عند الخروج
            window.addEventListener('beforeunload', () => {
                set(userRef, {
                    username: username,
                    isAdmin: isAdmin,
                    isOnline: false,
                    lastSeen: Date.now()
                });
            });
        }

        // ========================================
        // دالة Toast (إشعارات)
        // ========================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ========================================
        // دعم Enter
        // ========================================
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMessage();
            }
        });

        // ========================================
        // التحقق من تسجيل الدخول
        // ========================================
        if (!localStorage.getItem('chatUsername')) {
            window.location.href = 'pages/login.html';
        }

        // ========================================
        // دالة تسجيل الخروج
        // ========================================
        window.logout = function() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                // تحديث حالة المستخدم
                const userRef = ref(database, `users/${username}`);
                set(userRef, {
                    username: username,
                    isAdmin: isAdmin,
                    isOnline: false,
                    lastSeen: Date.now()
                });
                
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = 'pages/login.html';
            }
        };

        // ========================================
        // تهيئة التطبيق
        // ========================================
        updateUserStatus();
        loadUsers();
        
        console.log(`✅ تم تسجيل الدخول كـ: ${username} (${isAdmin ? '🛡️ مسؤول' : '👤 مستخدم'})`);
    </script>
</body>
</html>
