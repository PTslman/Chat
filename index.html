<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نيزك - منصة الدردشة</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="loader">
            <div class="spinner"></div>
            <h2>🚀 نيزك</h2>
            <p>جاري التحميل...</p>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" style="display:none;">
        <div class="login-container">
            <div class="login-box">
                <div class="logo">
                    <h1>🚀 نيزك</h1>
                    <p>منصة الدردشة المتكاملة</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">👤 اسم المستخدم</label>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                    </div>
                    <div class="form-group" id="password-group" style="display:none;">
                        <label for="password">🔑 كلمة المرور</label>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور">
                    </div>
                    <button type="submit" class="login-btn">دخول</button>
                </form>
                <div class="login-footer">
                    <p>مسؤول: slx23m | كلمة المرور: 1442</p>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة إعداد الملف الشخصي -->
    <div id="profile-setup" style="display:none;">
        <div class="profile-setup-container">
            <div class="profile-box">
                <h2>🎨 إعداد الملف الشخصي</h2>
                <div class="avatar-upload">
                    <img id="profile-preview" src="assets/images/default-avatar.png" alt="الصورة الشخصية">
                    <label for="avatar-input" class="upload-btn">
                        <span class="material-symbols-outlined">photo_camera</span>
                    </label>
                    <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                </div>
                <div class="form-group">
                    <label for="display-name">👤 الاسم المعروض</label>
                    <input type="text" id="display-name" placeholder="أدخل اسمك">
                </div>
                <div class="color-picker">
                    <label>🎨 اختر لونك المفضل</label>
                    <div class="color-options">
                        <div class="color-option" style="background:#25D366;" data-color="#25D366"></div>
                        <div class="color-option" style="background:#FF6B6B;" data-color="#FF6B6B"></div>
                        <div class="color-option" style="background:#4ECDC4;" data-color="#4ECDC4"></div>
                        <div class="color-option" style="background:#FFE66D;" data-color="#FFE66D"></div>
                        <div class="color-option" style="background:#A8E6CF;" data-color="#A8E6CF"></div>
                        <div class="color-option" style="background:#FF8A5C;" data-color="#FF8A5C"></div>
                        <div class="color-option" style="background:#6C5B7B;" data-color="#6C5B7B"></div>
                        <div class="color-option" style="background:#F8B500;" data-color="#F8B500"></div>
                    </div>
                </div>
                <button id="save-profile" class="save-btn">💾 حفظ وإتمام</button>
            </div>
        </div>
    </div>

    <!-- واجهة الدردشة الرئيسية -->
    <div id="chat-app" style="display:none;">
        <!-- رأس التطبيق -->
        <header class="chat-header">
            <div class="header-left">
                <img id="user-avatar" src="assets/images/default-avatar.png" alt="الصورة الشخصية">
                <div class="user-info">
                    <span id="user-name">المستخدم</span>
                    <span class="online-status">🟢 متصل</span>
                </div>
            </div>
            <div class="header-right">
                <span class="user-count">👥 <span id="online-count">0</span></span>
                <button id="theme-toggle" class="icon-btn">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <button id="admin-panel-btn" class="icon-btn" style="display:none;">
                    <span class="material-symbols-outlined">admin_panel_settings</span>
                </button>
                <button id="logout-btn" class="icon-btn">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </header>

        <!-- منطقة الدردشة -->
        <main class="chat-main">
            <div class="chat-messages" id="messages-container">
                <!-- الرسائل تظهر هنا ديناميكياً -->
            </div>
        </main>

        <!-- شريط الرد -->
        <div id="reply-bar" style="display:none;">
            <div class="reply-content">
                <div class="reply-info">
                    <span class="reply-to">الرد على: <span id="reply-username"></span></span>
                    <span class="reply-text" id="reply-text"></span>
                </div>
                <button id="cancel-reply" class="cancel-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>

        <!-- منطقة الإدخال -->
        <footer class="chat-footer">
            <button id="emoji-btn" class="icon-btn">
                <span class="material-symbols-outlined">emoji_emotions</span>
            </button>
            <div class="input-wrapper">
                <textarea id="message-input" rows="1" placeholder="اكتب رسالة..."></textarea>
                <div class="input-actions">
                    <button id="send-btn" class="send-btn">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </div>
            </div>
        </footer>

        <!-- لوحة الإيموجي -->
        <div id="emoji-panel" style="display:none;">
            <div class="emoji-grid">
                <span class="emoji">😊</span>
                <span class="emoji">😂</span>
                <span class="emoji">❤️</span>
                <span class="emoji">🔥</span>
                <span class="emoji">👍</span>
                <span class="emoji">👏</span>
                <span class="emoji">😍</span>
                <span class="emoji">🥰</span>
                <span class="emoji">😎</span>
                <span class="emoji">🤣</span>
                <span class="emoji">💀</span>
                <span class="emoji">😱</span>
                <span class="emoji">🎉</span>
                <span class="emoji">✨</span>
                <span class="emoji">🌟</span>
                <span class="emoji">💪</span>
                <span class="emoji">🤔</span>
                <span class="emoji">😅</span>
                <span class="emoji">🥺</span>
                <span class="emoji">🤗</span>
                <span class="emoji">😤</span>
                <span class="emoji">😴</span>
                <span class="emoji">🤩</span>
                <span class="emoji">🥳</span>
            </div>
        </div>

        <!-- قائمة خيارات الرسالة -->
        <div id="message-options" style="display:none;">
            <div class="options-overlay"></div>
            <div class="options-menu">
                <button class="option-btn" data-action="reply">
                    <span class="material-symbols-outlined">reply</span> رد
                </button>
                <button class="option-btn" data-action="react">
                    <span class="material-symbols-outlined">emoji_emotions</span> تفاعل
                </button>
                <button class="option-btn" data-action="copy">
                    <span class="material-symbols-outlined">content_copy</span> نسخ
                </button>
                <button class="option-btn" data-action="edit">
                    <span class="material-symbols-outlined">edit</span> تعديل
                </button>
                <button class="option-btn" data-action="report">
                    <span class="material-symbols-outlined">flag</span> إبلاغ
                </button>
                <button class="option-btn admin-only" data-action="delete">
                    <span class="material-symbols-outlined">delete</span> حذف
                </button>
                <button class="option-btn admin-only" data-action="ban">
                    <span class="material-symbols-outlined">block</span> حظر
                </button>
            </div>
        </div>

        <!-- لوحة المسؤول -->
        <div id="admin-panel" style="display:none;">
            <div class="admin-panel-overlay"></div>
            <div class="admin-panel-content">
                <div class="admin-header">
                    <h2>🛡️ لوحة تحكم المسؤول</h2>
                    <button id="close-admin" class="close-btn">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="users">👥 المستخدمين</button>
                    <button class="tab-btn" data-tab="banned">🚫 المحظورين</button>
                    <button class="tab-btn" data-tab="words">📝 الكلمات المحظورة</button>
                    <button class="tab-btn" data-tab="settings">⚙️ الإعدادات</button>
                </div>
                <div class="admin-content">
                    <div id="users-tab" class="tab-content active">
                        <div id="users-list"></div>
                    </div>
                    <div id="banned-tab" class="tab-content">
                        <div id="banned-list"></div>
                    </div>
                    <div id="words-tab" class="tab-content">
                        <div class="add-word">
                            <input type="text" id="new-word" placeholder="أضف كلمة محظورة">
                            <button id="add-word-btn">➕ إضافة</button>
                        </div>
                        <div id="words-list"></div>
                    </div>
                    <div id="settings-tab" class="tab-content">
                        <button id="clear-all-messages" class="danger-btn">🗑️ حذف جميع الرسائل</button>
                        <button id="logout-all-users" class="danger-btn">🚪 تسجيل خروج الجميع</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- عارض الصور -->
    <div id="image-viewer" style="display:none;">
        <div class="viewer-overlay"></div>
        <div class="viewer-content">
            <button id="close-viewer" class="close-btn">✕</button>
            <img id="viewer-image" src="" alt="الصورة">
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
