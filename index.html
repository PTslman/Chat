<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 دردشة - تصميم iPhone</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===== إعدادات عامة ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        /* ===== حاوية التطبيق ===== */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== رأس الدردشة (مثل iPhone) ===== */
        .chat-header {
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            min-height: 56px;
            padding-top: 44px;
            position: relative;
            z-index: 10;
        }

        /* الساعة في الأعلى (مثل iPhone) */
        .status-bar {
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            color: #0a84ff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #0a84ff, #5ac8fa);
            position: relative;
        }

        .avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            background: #34c759;
            border-radius: 50%;
            border: 2px solid #1c1c1e;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .header-info .name {
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-info .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-info .subtitle .typing-dots {
            display: none;
            gap: 3px;
        }

        .header-info .subtitle .typing-dots.active {
            display: flex;
        }

        .header-info .subtitle .typing-dots span {
            width: 6px;
            height: 6px;
            background: #0a84ff;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .header-info .subtitle .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .header-info .subtitle .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .header-actions {
            display: flex;
            gap: 16px;
            color: #0a84ff;
            font-size: 20px;
        }

        .header-actions i {
            cursor: pointer;
        }

        /* ===== منطقة الرسائل ===== */
        .chat-messages {
            flex: 1;
            padding: 8px 16px 4px;
            overflow-y: auto;
            overflow-x: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 0;
        }

        /* ===== باقة الرسائل (مثل iPhone) ===== */
        .message-group {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: messageIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .message-group.self {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-group.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* اسم المرسل (فقط لغير self) */
        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            padding: 0 12px 2px;
            display: none;
        }

        .message-group.other .message-sender {
            display: block;
        }

        /* فقاعة الرسالة */
        .message-bubble {
            padding: 9px 14px 8px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            font-size: 16px;
            line-height: 1.45;
            letter-spacing: -0.2px;
            transition: 0.15s;
            max-width: 100%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-group.self .message-bubble {
            background: #0a84ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-group.other .message-bubble {
            background: #2c2c2e;
            color: white;
            border-bottom-left-radius: 4px;
        }

        /* الرد على رسالة داخل الفقاعة */
        .reply-preview {
            background: rgba(255, 255, 255, 0.06);
            border-right: 3px solid #0a84ff;
            padding: 4px 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .reply-preview .reply-sender {
            color: #0a84ff;
            font-weight: 600;
        }

        /* نص الرسالة */
        .message-text {
            font-size: 16px;
            line-height: 1.45;
            word-break: break-word;
        }

        /* توقيت الرسالة */
        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            padding: 0 4px;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-group.self .message-time {
            color: rgba(255, 255, 255, 0.4);
        }

        /* حالة القراءة (مثل iPhone) */
        .read-status {
            font-size: 12px;
            color: #0a84ff;
        }

        /* ===== أزرار التفاعل (تظهر عند hover/لمس مطول) ===== */
        .message-actions-overlay {
            position: absolute;
            top: -32px;
            background: rgba(44, 44, 46, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 4px 6px;
            display: none;
            gap: 2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 20;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            animation: actionsPop 0.2s ease;
        }

        .message-group.self .message-actions-overlay {
            right: 0;
            left: auto;
        }

        .message-group.other .message-actions-overlay {
            left: 0;
            right: auto;
        }

        @keyframes actionsPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .message-actions-overlay.active {
            display: flex;
        }

        .message-actions-overlay button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 12px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-actions-overlay button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .message-actions-overlay button.delete:hover {
            color: #ff3b30;
        }

        .message-actions-overlay button.reply-btn:hover {
            color: #0a84ff;
        }

        /* ===== شريط الإيموجي (مثل فيسبوك ماسنجر) ===== */
        .emoji-rail {
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: rgba(44, 44, 46, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 8px 12px;
            display: none;
            gap: 6px;
            justify-content: center;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.6);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            z-index: 30;
            animation: emojiRailUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-wrap: wrap;
        }

        .emoji-rail.active {
            display: flex;
        }

        @keyframes emojiRailUp {
            from {
                transform: translateY(20px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .emoji-rail .emoji-item {
            font-size: 32px;
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.15s;
            user-select: none;
            background: transparent;
            border: none;
            line-height: 1;
        }

        .emoji-rail .emoji-item:hover,
        .emoji-rail .emoji-item:active {
            transform: scale(1.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .emoji-rail .emoji-item:active {
            transform: scale(0.9);
        }

        /* ===== إدخال الرسالة (مثل iPhone) ===== */
        .chat-input {
            padding: 8px 12px 12px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            padding-bottom: 20px;
        }

        .chat-input .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input .input-row .input-wrapper {
            flex: 1;
            background: #2c2c2e;
            border-radius: 25px;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .chat-input .input-row .input-wrapper:focus-within {
            border-color: #0a84ff;
        }

        .chat-input .input-row .input-wrapper .attach-btn {
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            padding: 6px 8px;
            cursor: pointer;
        }

        .chat-input .input-row .input-wrapper input {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: white;
            font-size: 16px;
            outline: none;
            min-width: 0;
        }

        .chat-input .input-row .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .chat-input .input-row .input-wrapper input:disabled {
            opacity: 0.5;
        }

        .chat-input .input-row .input-wrapper .emoji-toggle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            padding: 6px 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input .input-row .input-wrapper .emoji-toggle.active {
            color: #0a84ff;
        }

        .chat-input .input-row .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0a84ff;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input .input-row .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .chat-input .input-row .send-btn:not(:disabled):active {
            transform: scale(0.9);
        }

        /* ===== رسائل النظام ===== */
        .system-message {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            margin: 4px auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            max-width: 80%;
        }

        /* ===== شاشة تسجيل الدخول ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-box {
            background: #1c1c1e;
            padding: 40px 32px;
            border-radius: 30px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .login-box .logo {
            font-size: 60px;
            margin-bottom: 4px;
        }

        .login-box h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-box h1 span {
            color: #0a84ff;
        }

        .login-box p {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: #2c2c2e;
            color: white;
            font-size: 17px;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        .login-box input:focus {
            border-color: #0a84ff;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .login-box .color-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }

        .login-box .color-options .color-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box .color-options .color-circle:hover {
            transform: scale(1.1);
        }
        .login-box .color-options .color-circle.selected {
            border-color: white;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.2);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 14px;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box .login-btn:active {
            transform: scale(0.97);
        }

        .login-box .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-box .error {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* ===== حالة عدم وجود رسائل ===== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            gap: 8px;
        }

        .empty-state i {
            font-size: 48px;
        }

        .empty-state span {
            font-size: 14px;
        }

        /* ===== تأثير اللمس المطول ===== */
        .message-group .message-bubble {
            transition: transform 0.15s;
        }

        .message-group.long-press .message-bubble {
            transform: scale(0.95);
        }

        /* ===== متجاوب للجوال ===== */
        @media (max-width: 430px) {
            .app-container {
                max-height: 100vh;
                border-radius: 0;
            }
            .chat-header {
                padding-top: 44px;
            }
            .login-box {
                padding: 32px 20px;
            }
        }

        /* ===== شريط التمرير المخفي ===== */
        .hidden-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .hidden-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="logo">💬</div>
            <h1>دردشة <span>فورية</span></h1>
            <p>اختر اسماً ولونك المفضل</p>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم..." maxlength="20">
            <div class="color-options" id="colorPicker">
                <div class="color-circle selected" style="background:#0a84ff;" data-color="#0a84ff"></div>
                <div class="color-circle" style="background:#ff3b30;" data-color="#ff3b30"></div>
                <div class="color-circle" style="background:#ff9500;" data-color="#ff9500"></div>
                <div class="color-circle" style="background:#ffcc00;" data-color="#ffcc00"></div>
                <div class="color-circle" style="background:#34c759;" data-color="#34c759"></div>
                <div class="color-circle" style="background:#af52de;" data-color="#af52de"></div>
                <div class="color-circle" style="background:#ff6b8a;" data-color="#ff6b8a"></div>
                <div class="color-circle" style="background:#5ac8fa;" data-color="#5ac8fa"></div>
            </div>
            <button class="login-btn" id="loginBtn">🚀 دخول</button>
            <div class="error" id="loginError">⚠️ الرجاء إدخال اسم صحيح (حرفين على الأقل)</div>
            <div class="error" id="connectionError" style="display:none;"></div>
        </div>
    </div>

    <!-- ===== واجهة الدردشة ===== -->
    <div class="app-container" id="chatContainer" style="display:none;">

        <!-- رأس الدردشة -->
        <div class="chat-header">
            <div class="status-bar" id="statusTime">12:00</div>
            <div class="header-left">
                <span class="back-btn">‹</span>
                <div class="avatar-container">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div class="online-dot"></div>
                </div>
                <div class="header-info">
                    <div class="name" id="currentUser">اسم المستخدم</div>
                    <div class="subtitle" id="userStatus">
                        <span id="onlineStatus">🟢 متصل</span>
                        <div class="typing-dots" id="typingDots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <i class="fas fa-phone"></i>
                <i class="fas fa-video"></i>
            </div>
        </div>

        <!-- منطقة الرسائل -->
        <div class="chat-messages hidden-scroll" id="messages">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-comment-dots"></i>
                <span>لا توجد رسائل بعد</span>
                <span style="font-size:12px;color:rgba(255,255,255,0.08);">كن أول من يكتب! ✨</span>
            </div>
        </div>

        <!-- شريط الإيموجي -->
        <div class="emoji-rail" id="emojiRail">
            <button class="emoji-item">😊</button>
            <button class="emoji-item">😂</button>
            <button class="emoji-item">❤️</button>
            <button class="emoji-item">🔥</button>
            <button class="emoji-item">👍</button>
            <button class="emoji-item">👏</button>
            <button class="emoji-item">😍</button>
            <button class="emoji-item">🤩</button>
            <button class="emoji-item">💯</button>
            <button class="emoji-item">🎉</button>
            <button class="emoji-item">✨</button>
            <button class="emoji-item">💪</button>
            <button class="emoji-item">🤔</button>
            <button class="emoji-item">😎</button>
            <button class="emoji-item">🥰</button>
            <button class="emoji-item">😭</button>
            <button class="emoji-item">🤣</button>
            <button class="emoji-item">😱</button>
        </div>

        <!-- إدخال الرسالة -->
        <div class="chat-input">
            <div class="input-row">
                <div class="input-wrapper">
                    <span class="attach-btn"><i class="fas fa-plus-circle"></i></span>
                    <input type="text" id="msgInput" placeholder="اكتب رسالة..." disabled>
                    <span class="emoji-toggle" id="emojiToggle"><i class="far fa-smile"></i></span>
                </div>
                <button class="send-btn" id="sendBtn" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 إعدادات Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDKF6Jb-CLB8xM7TvNfoRnxWgiwD54SOXo",
            authDomain: "chat-app-ba3c8.firebaseapp.com",
            projectId: "chat-app-ba3c8",
            storageBucket: "chat-app-ba3c8.firebasestorage.app",
            messagingSenderId: "181727674867",
            appId: "1:181727674867:web:ae9824d9051bab9f73d286",
            measurementId: "G-VEL3PGTKY1"
        };

        // ============================================================
        // تهيئة Firebase
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // المتغيرات العامة
        // ============================================================
        let currentUser = '';
        let userColor = '#0a84ff';
        let isLoggedIn = false;
        let replyTo = null;
        let editingMessage = null;
        let longPressTimer = null;
        let isLongPress = false;
        let selectedMessageId = null;

        // عناصر DOM
        const loginOverlay = document.getElementById('loginOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const connectionError = document.getElementById('connectionError');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentUserSpan = document.getElementById('currentUser');
        const userAvatar = document.getElementById('userAvatar');
        const onlineStatus = document.getElementById('onlineStatus');
        const typingDots = document.getElementById('typingDots');
        const emojiToggle = document.getElementById('emojiToggle');
        const emojiRail = document.getElementById('emojiRail');
        const emptyState = document.getElementById('emptyState');

        // ============================================================
        // الساعة في شريط الحالة
        // ============================================================
        function updateStatusBar() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('statusTime').textContent = `${hours}:${mins}`;
        }
        updateStatusBar();
        setInterval(updateStatusBar, 30000);

        // ============================================================
        // اختيار اللون
        // ============================================================
        document.querySelectorAll('.color-circle').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                userColor = this.dataset.color;
            });
        });

        // ============================================================
        // شريط الإيموجي (تبديل)
        // ============================================================
        emojiToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiRail.classList.toggle('active');
            emojiToggle.classList.toggle('active');
        });

        // إغلاق شريط الإيموجي عند النقر خارجه
        document.addEventListener('click', (e) => {
            if (!emojiRail.contains(e.target) && e.target !== emojiToggle && !emojiToggle.contains(e.target)) {
                emojiRail.classList.remove('active');
                emojiToggle.classList.remove('active');
            }
        });

        // إضافة الإيموجي عند النقر عليه
        document.querySelectorAll('.emoji-item').forEach(el => {
            el.addEventListener('click', () => {
                msgInput.value += el.textContent;
                msgInput.focus();
                emojiRail.classList.remove('active');
                emojiToggle.classList.remove('active');
            });
        });

        // ============================================================
        // إنشاء رسالة في الواجهة
        // ============================================================
        function createMessageElement(docId, data, isSelf) {
            const group = document.createElement('div');
            group.className = `message-group ${isSelf ? 'self' : 'other'}`;
            group.dataset.id = docId;
            group.dataset.sender = data.sender;

            // اسم المرسل
            const sender = document.createElement('div');
            sender.className = 'message-sender';
            sender.textContent = data.sender;

            // فقاعة الرسالة
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            // الرد إذا وجد
            if (data.replyTo) {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'reply-preview';
                replyDiv.innerHTML = `
                    <span class="reply-sender">@${data.replyTo.sender}</span>
                    ${data.replyTo.text}
                `;
                bubble.appendChild(replyDiv);
            }

            // نص الرسالة
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = data.text;
            bubble.appendChild(textDiv);

            // التوقيت وحالة القراءة
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            if (data.timestamp) {
                const date = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                timeDiv.innerHTML = `${date.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })}`;
                if (isSelf) {
                    timeDiv.innerHTML += ` <span class="read-status"><i class="fas fa-check-double"></i></span>`;
                }
            }

            // أزرار التفاعل (تظهر عند اللمس المطول)
            const actions = document.createElement('div');
            actions.className = 'message-actions-overlay';
            actions.innerHTML = `
                <button class="reply-btn" title="رد"><i class="fas fa-reply"></i></button>
                ${isSelf ? `<button class="edit-btn" title="تعديل"><i class="fas fa-pen"></i></button>` : ''}
                ${isSelf ? `<button class="delete-btn" title="حذف"><i class="fas fa-trash"></i></button>` : ''}
            `;

            // أحداث الأزرار
            actions.querySelector('.reply-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                setReplyTo(docId, data.sender, data.text);
                hideAllActions();
            });

            if (isSelf) {
                const editBtn = actions.querySelector('.edit-btn');
                const deleteBtn = actions.querySelector('.delete-btn');
                if (editBtn) {
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEditing(docId, data.text);
                        hideAllActions();
                    });
                }
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteMessage(docId);
                        hideAllActions();
                    });
                }
            }

            group.appendChild(sender);
            group.appendChild(bubble);
            group.appendChild(timeDiv);
            group.appendChild(actions);

            // ===== أحداث اللمس المطول =====
            let pressTimer = null;
            let isPressed = false;

            group.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isPressed = true;
                pressTimer = setTimeout(() => {
                    if (isPressed) {
                        showActions(group);
                    }
                }, 500);
            });

            group.addEventListener('mouseup', () => {
                isPressed = false;
                clearTimeout(pressTimer);
            });

            group.addEventListener('mouseleave', () => {
                isPressed = false;
                clearTimeout(pressTimer);
            });

            // للجوال
            group.addEventListener('touchstart', (e) => {
                isPressed = true;
                pressTimer = setTimeout(() => {
                    if (isPressed) {
                        e.preventDefault();
                        showActions(group);
                    }
                }, 500);
            });

            group.addEventListener('touchend', () => {
                isPressed = false;
                clearTimeout(pressTimer);
            });

            group.addEventListener('touchmove', () => {
                isPressed = false;
                clearTimeout(pressTimer);
            });

            return group;
        }

        // ============================================================
        // إظهار وإخفاء أزرار التفاعل
        // ============================================================
        function showActions(group) {
            hideAllActions();
            const actions = group.querySelector('.message-actions-overlay');
            if (actions) {
                actions.classList.add('active');
                selectedMessageId = group.dataset.id;
            }
        }

        function hideAllActions() {
            document.querySelectorAll('.message-actions-overlay.active').forEach(el => {
                el.classList.remove('active');
            });
        }

        document.addEventListener('click', hideAllActions);

        // ============================================================
        // إضافة رسالة للواجهة
        // ============================================================
        function addMessageToUI(docId, data, isSelf) {
            if (emptyState) emptyState.style.display = 'none';
            const el = createMessageElement(docId, data, isSelf);
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        // رسالة نظام
        // ============================================================
        function addSystemMessage(text) {
            if (emptyState) emptyState.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'system-message';
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================================
        // تحميل الرسائل
        // ============================================================
        function loadMessages() {
            if (emptyState) emptyState.style.display = 'flex';

            db.collection('messages')
                .orderBy('timestamp', 'asc')
                .limit(100)
                .get()
                .then((snapshot) => {
                    if (emptyState) emptyState.style.display = 'none';
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const isSelf = data.sender === currentUser;
                        addMessageToUI(doc.id, data, isSelf);
                    });
                    if (snapshot.empty && emptyState) emptyState.style.display = 'flex';
                })
                .catch((error) => {
                    console.error('❌ Error loading messages:', error);
                });
        }

        // ============================================================
        // الاستماع للرسائل
        // ============================================================
        let unsubscribeMessages = null;

        function listenToMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = db.collection('messages')
                .orderBy('timestamp', 'asc')
                .limit(100)
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            const isSelf = data.sender === currentUser;
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (!existing) {
                                addMessageToUI(change.doc.id, data, isSelf);
                            }
                        }
                        if (change.type === 'modified') {
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (existing) {
                                const data = change.doc.data();
                                const textDiv = existing.querySelector('.message-text');
                                if (textDiv) textDiv.textContent = data.text;
                            }
                        }
                        if (change.type === 'removed') {
                            const existing = messagesDiv.querySelector(`[data-id="${change.doc.id}"]`);
                            if (existing) existing.remove();
                        }
                    });
                    if (snapshot.empty) {
                        if (emptyState) emptyState.style.display = 'flex';
                    } else {
                        if (emptyState) emptyState.style.display = 'none';
                    }
                }, (error) => {
                    console.error('❌ Error listening:', error);
                });
        }

        // ============================================================
        // إرسال رسالة
        // ============================================================
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !isLoggedIn) return;

            if (editingMessage) {
                updateMessage(editingMessage.id, text);
                return;
            }

            sendBtn.disabled = true;
            msgInput.disabled = true;

            const messageData = {
                text: text,
                sender: currentUser,
                color: userColor,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (replyTo) {
                messageData.replyTo = {
                    id: replyTo.id,
                    sender: replyTo.sender,
                    text: replyTo.text.substring(0, 60) + (replyTo.text.length > 60 ? '...' : '')
                };
            }

            db.collection('messages').add(messageData)
                .then(() => {
                    msgInput.value = '';
                    msgInput.focus();
                    clearReply();
                })
                .catch((error) => {
                    console.error('❌ Error sending:', error);
                    alert('⚠️ فشل الإرسال: ' + error.message);
                })
                .finally(() => {
                    sendBtn.disabled = false;
                    msgInput.disabled = false;
                });
        }

        // ============================================================
        // تعديل رسالة
        // ============================================================
        function startEditing(id, text) {
            editingMessage = { id, text };
            msgInput.value = text;
            msgInput.focus();
            sendBtn.innerHTML = '<i class="fas fa-check"></i>';
            sendBtn.style.background = '#ffcc00';
        }

        function updateMessage(id, newText) {
            if (!editingMessage) return;

            db.collection('messages').doc(id).update({
                text: newText,
                edited: true
            })
            .then(() => {
                editingMessage = null;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                sendBtn.style.background = '';
                msgInput.value = '';
            })
            .catch((error) => {
                console.error('❌ Error updating:', error);
                alert('⚠️ فشل التعديل: ' + error.message);
            });
        }

        // ============================================================
        // حذف رسالة
        // ============================================================
        function deleteMessage(id) {
            if (!confirm('🗑️ هل أنت متأكد من حذف هذه الرسالة؟')) return;

            db.collection('messages').doc(id).delete()
                .catch((error) => {
                    console.error('❌ Error deleting:', error);
                    alert('⚠️ فشل الحذف: ' + error.message);
                });
        }

        // ============================================================
        // الرد على رسالة
        // ============================================================
        function setReplyTo(id, sender, text) {
            replyTo = { id, sender, text };
            msgInput.placeholder = `رد على @${sender}...`;
            msgInput.focus();
            // نضيف مؤشر بسيط في الإدخال
        }

        function clearReply() {
            replyTo = null;
            msgInput.placeholder = 'اكتب رسالة...';
        }

        // الضغط على Escape لإلغاء الرد
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (editingMessage) {
                    editingMessage = null;
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    sendBtn.style.background = '';
                    msgInput.value = '';
                }
                clearReply();
            }
        });

        // ============================================================
        // تحديث حالة المتصلين
        // ============================================================
        function updateOnlineStatus() {
            db.collection('users')
                .where('online', '==', true)
                .get()
                .then((snapshot) => {
                    const count = snapshot.size;
                    onlineStatus.textContent = count > 1 ? `🟢 ${count} متصل` : '🟢 متصل';
                })
                .catch((error) => {
                    console.error('❌ Error getting online:', error);
                });
        }

        // ============================================================
        // إدارة حالة المستخدم
        // ============================================================
        function setUserOnline(username) {
            db.collection('users').doc(username).set({
                username: username,
                color: userColor,
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => {
                console.error('❌ Error setting online:', error);
            });
        }

        function setUserOffline(username) {
            db.collection('users').doc(username).update({
                online: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch((error) => {
                console.error('❌ Error setting offline:', error);
            });
        }

        // ============================================================
        // تسجيل الدخول
        // ============================================================
        async function login() {
            const username = usernameInput.value.trim();
            if (!username || username.length < 2) {
                loginError.style.display = 'block';
                return;
            }
            loginError.style.display = 'none';
            connectionError.style.display = 'none';

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري...';

            try {
                await auth.signInAnonymously();

                currentUser = username;
                isLoggedIn = true;

                loginOverlay.style.display = 'none';
                chatContainer.style.display = 'flex';
                currentUserSpan.textContent = username;
                userAvatar.textContent = username.charAt(0).toUpperCase();

                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.focus();

                setUserOnline(username);
                addSystemMessage(`👋 ${username} انضم إلى الدردشة`);

                loadMessages();
                listenToMessages();
                updateOnlineStatus();
                setInterval(updateOnlineStatus, 10000);

                window.addEventListener('beforeunload', () => {
                    setUserOffline(username);
                });

            } catch (error) {
                console.error('❌ Login error:', error);
                connectionError.textContent = '❌ ' + error.message;
                connectionError.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 دخول';
            }
        }

        // ============================================================
        // الأحداث
        // ============================================================
        loginBtn.addEventListener('click', login);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        console.log('🚀 Chat app ready!');

        // ============================================================
        // تفعيل إيموجي الرموز التعبيرية في شريط الإيموجي
        // ============================================================
        // إضافة المزيد من الإيموجي عند النقر على شريط الإيموجي نفسه
        // (تم تضمينها بالفعل في HTML)
    </script>
</body>
</html>
