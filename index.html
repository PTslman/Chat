<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نيزك - تطبيق المراسلة السحابي</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="anime-bg">
        <div class="particles"></div>
        <div class="login-container">
            <div class="anime-avatar">
                <img src="https://i.imgur.com/5QY8Q7K.png" alt="نيزك">
            </div>
            <h1>🌟 نيزك</h1>
            <p>تطبيق المراسلة السحابي</p>
            
            <div id="login-box">
                <input type="text" id="username-input" placeholder="اسم المستخدم" maxlength="20">
                <input type="password" id="password-input" placeholder="كلمة المرور (للمسؤول فقط)">
                <button id="login-btn">🚀 دخول</button>
                <div id="login-status"></div>
            </div>
            
            <div class="anime-quote">"في سماء الدردشة، كل نيزك يحمل رسالة"</div>
        </div>
    </div>
    
    <script type="module" src="login.js"></script>
</body>
</html>
